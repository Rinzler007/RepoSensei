<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoSensei</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap");

      :root {
        --bg: #060910;
        --surface: rgba(255, 255, 255, 0.03);
        --surface-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.08);
        --border-active: rgba(99, 179, 237, 0.5);
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --text-muted: #484f58;
        --accent: #63b3ed;
        --accent-glow: rgba(99, 179, 237, 0.15);
        --green: #56d364;
        --green-glow: rgba(86, 211, 100, 0.15);
        --purple: #bc8cff;
        --orange: #f0a732;
        --red: #f85149;
        --radius: 16px;
        --radius-sm: 10px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* --- Background grid + orbs --- */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(99, 179, 237, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 179, 237, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
        z-index: 0;
      }

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
        z-index: 0;
      }
      .orb-1 {
        width: 600px;
        height: 600px;
        background: rgba(99, 179, 237, 0.07);
        top: -200px;
        right: -100px;
      }
      .orb-2 {
        width: 500px;
        height: 500px;
        background: rgba(188, 140, 255, 0.06);
        bottom: -150px;
        left: -100px;
      }

      /* --- Layout --- */
      .page {
        position: relative;
        z-index: 1;
        max-width: 760px;
        margin: 0 auto;
        padding: 64px 24px 80px;
      }

      /* --- Header --- */
      header {
        text-align: center;
        margin-bottom: 56px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 14px;
        border-radius: 99px;
        border: 1px solid rgba(99, 179, 237, 0.25);
        background: rgba(99, 179, 237, 0.08);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.8);
        }
      }

      header h1 {
        font-size: clamp(2.2rem, 5vw, 3.2rem);
        font-weight: 800;
        letter-spacing: -1.5px;
        line-height: 1.1;
        background: linear-gradient(
          135deg,
          #f0f6fc 0%,
          #63b3ed 50%,
          #bc8cff 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 14px;
      }

      header p {
        color: var(--text-secondary);
        font-size: 1.05rem;
        font-weight: 400;
        max-width: 460px;
        margin: 0 auto;
        line-height: 1.6;
      }

      /* --- Input card --- */
      .input-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
        backdrop-filter: blur(12px);
        transition: border-color 0.3s;
      }

      .input-card:focus-within {
        border-color: rgba(99, 179, 237, 0.3);
        box-shadow:
          0 0 0 3px rgba(99, 179, 237, 0.06),
          0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .input-label {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-secondary);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }

      .input-wrap {
        flex: 1;
        position: relative;
      }

      .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      input[type="text"] {
        width: 100%;
        padding: 12px 14px 12px 42px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.3);
        color: var(--text-primary);
        font-size: 0.95rem;
        font-family: "Inter", sans-serif;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--border-active);
        box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.08);
      }

      input[type="text"]::placeholder {
        color: var(--text-muted);
      }

      .btn {
        padding: 12px 22px;
        border-radius: var(--radius-sm);
        border: none;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s,
          opacity 0.15s;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
      }

      .btn:active:not(:disabled) {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* --- Format toggle --- */
      .format-row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .fmt-option {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 9px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
      }

      .fmt-option input {
        display: none;
      }

      .fmt-option:has(input:checked) {
        border-color: rgba(99, 179, 237, 0.4);
        background: rgba(99, 179, 237, 0.08);
        color: var(--accent);
      }

      .fmt-option:hover:not(:has(input:checked)) {
        border-color: rgba(255, 255, 255, 0.12);
        background: var(--surface-hover);
        color: var(--text-primary);
      }

      /* --- Error --- */
      .error-box {
        display: none;
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        background: rgba(248, 81, 73, 0.1);
        border: 1px solid rgba(248, 81, 73, 0.3);
        color: #f85149;
        font-size: 0.85rem;
        line-height: 1.5;
      }

      /* --- Spinner --- */
      .loader {
        display: none;
        margin: 48px auto;
        text-align: center;
      }

      .loader-ring {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid rgba(99, 179, 237, 0.15);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader p {
        color: var(--text-secondary);
        font-size: 0.88rem;
      }

      .loader .sub {
        color: var(--text-muted);
        font-size: 0.78rem;
        margin-top: 4px;
      }

      /* --- Results --- */
      #results {
        display: none;
        margin-top: 32px;
      }

      .results-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .results-header h2 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .results-header .repo-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 99px;
        background: rgba(86, 211, 100, 0.1);
        border: 1px solid rgba(86, 211, 100, 0.25);
        color: var(--green);
        font-size: 0.75rem;
        font-weight: 500;
        font-family: "JetBrains Mono", monospace;
      }

      /* Sections */
      .section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 14px;
        animation: fadeUp 0.4s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .section:nth-child(1) {
        animation-delay: 0.05s;
      }
      .section:nth-child(2) {
        animation-delay: 0.1s;
      }
      .section:nth-child(3) {
        animation-delay: 0.15s;
      }
      .section:nth-child(4) {
        animation-delay: 0.2s;
      }
      .section:nth-child(5) {
        animation-delay: 0.25s;
      }
      .section:nth-child(6) {
        animation-delay: 0.3s;
      }
      .section:nth-child(7) {
        animation-delay: 0.35s;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 14px;
      }

      .section-label .icon {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
      }

      /* Overview */
      .overview-text {
        font-size: 0.95rem;
        line-height: 1.75;
        color: #c9d1d9;
      }

      /* Tech stack */
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .tag {
        padding: 4px 12px;
        border-radius: 99px;
        font-size: 0.78rem;
        font-weight: 500;
        border: 1px solid rgba(99, 179, 237, 0.2);
        background: rgba(99, 179, 237, 0.07);
        color: #93c5fd;
      }

      /* Module map */
      .module {
        padding: 14px 16px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.2);
        margin-bottom: 10px;
      }

      .module:last-child {
        margin-bottom: 0;
      }

      .module-name {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 4px;
      }

      .module-purpose {
        font-size: 0.83rem;
        color: var(--text-secondary);
        line-height: 1.5;
      }

      .module-files {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .file-chip {
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(99, 179, 237, 0.08);
        color: var(--accent);
        font-size: 0.72rem;
        font-family: "JetBrains Mono", monospace;
      }

      /* Critical flows */
      .flow {
        margin-bottom: 18px;
      }
      .flow:last-child {
        margin-bottom: 0;
      }

      .flow-name {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--purple);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .flow-name::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--purple);
        box-shadow: 0 0 8px var(--purple);
        flex-shrink: 0;
      }

      .flow ol {
        padding-left: 0;
        list-style: none;
        counter-reset: step;
      }

      .flow ol li {
        counter-increment: step;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        font-size: 0.85rem;
        color: #c9d1d9;
        padding: 7px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        line-height: 1.55;
      }

      .flow ol li:last-child {
        border-bottom: none;
      }

      .flow ol li::before {
        content: counter(step);
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        border-radius: 6px;
        background: rgba(188, 140, 255, 0.12);
        border: 1px solid rgba(188, 140, 255, 0.2);
        color: var(--purple);
        font-size: 0.7rem;
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 1px;
      }

      /* Onboarding */
      .onboarding-list {
        list-style: none;
        padding: 0;
      }

      .onboarding-list li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        font-size: 0.88rem;
        color: #c9d1d9;
        padding: 9px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        line-height: 1.55;
        counter-increment: path;
      }

      .onboarding-list {
        counter-reset: path;
      }

      .onboarding-list li:last-child {
        border-bottom: none;
      }

      .onboarding-list li::before {
        content: counter(path);
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        border-radius: 6px;
        background: rgba(86, 211, 100, 0.1);
        border: 1px solid rgba(86, 211, 100, 0.2);
        color: var(--green);
        font-size: 0.7rem;
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 1px;
      }

      /* Improvements */
      .improvement-list {
        list-style: none;
        padding: 0;
      }

      .improvement-list li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 0.88rem;
        color: #c9d1d9;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        line-height: 1.55;
      }

      .improvement-list li:last-child {
        border-bottom: none;
      }

      .improvement-list li::before {
        content: "→";
        color: var(--orange);
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 1px;
      }

      /* Mermaid */
      pre.mermaid-raw {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 18px;
        font-size: 0.78rem;
        font-family: "JetBrains Mono", monospace;
        color: #8b949e;
        overflow-x: auto;
        white-space: pre;
        line-height: 1.6;
      }

      /* Markdown output */
      pre.md-output {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 20px;
        font-size: 0.83rem;
        font-family: "JetBrains Mono", monospace;
        line-height: 1.75;
        overflow-x: auto;
        color: #c9d1d9;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* Divider between flows */
      .flow-divider {
        height: 1px;
        background: var(--border);
        margin: 16px 0;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="page">
      <header>
        <div class="badge"><span class="dot"></span> AI-Powered</div>
        <h1>RepoSensei 🥋</h1>
        <p>
          Instantly understand any codebase. Paste a public GitHub URL and get a
          full architecture breakdown.
        </p>
      </header>

      <div class="input-card">
        <div class="input-label">Repository URL</div>
        <div class="input-row">
          <div class="input-wrap">
            <svg
              class="input-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
              />
            </svg>
            <input
              type="text"
              id="repoUrl"
              placeholder="https://github.com/user/repo"
            />
          </div>
          <button class="btn" id="analyzeBtn" onclick="analyze()">
            Analyze →
          </button>
        </div>

        <div class="format-row">
          <label class="fmt-option">
            <input type="radio" name="fmt" value="json" checked />
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            Structured Report
          </label>
          <label class="fmt-option">
            <input type="radio" name="fmt" value="md" />
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
            Markdown Doc
          </label>
        </div>

        <div class="error-box" id="errorBox"></div>
      </div>

      <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <p>Analyzing repository…</p>
        <p class="sub">Cloning, scanning signals, generating report</p>
      </div>

      <div id="results"></div>
    </div>

    <script>
      // Cache for parallel results
      let cache = { json: null, md: null, url: null };

      async function analyze() {
        const url = document.getElementById("repoUrl").value.trim();
        const btn = document.getElementById("analyzeBtn");
        const loader = document.getElementById("loader");
        const errorBox = document.getElementById("errorBox");
        const results = document.getElementById("results");

        if (!url) {
          shake(document.getElementById("repoUrl"));
          return;
        }

        // Reset cache
        cache = { json: null, md: null, url };

        btn.disabled = true;
        loader.style.display = "block";
        errorBox.style.display = "none";
        results.style.display = "none";
        results.innerHTML = "";

        const body = JSON.stringify({ repo_url: url });
        const headers = { "Content-Type": "application/json" };

        try {
          // Single request: one clone, one LLM call, both formats returned
          const res = await fetch("/analyze", {
            method: "POST",
            headers,
            body,
          });

          if (!res.ok) {
            const err = await res
              .json()
              .catch(() => ({ detail: res.statusText }));
            throw new Error(err.detail || res.statusText);
          }

          const both = await res.json();
          cache.json = both.report;
          cache.md = both.md;

          showActiveTab(url);
          results.style.display = "block";
          results.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (e) {
          errorBox.textContent = "Error: " + e.message;
          errorBox.style.display = "block";
        } finally {
          btn.disabled = false;
          loader.style.display = "none";
        }
      }

      function showActiveTab(url) {
        const fmt = document.querySelector('input[name="fmt"]:checked').value;
        const results = document.getElementById("results");
        if (!cache.json && !cache.md) return;

        if (fmt === "md" && cache.md) {
          results.innerHTML = `<div class="section"><pre class="md-output">${escHtml(cache.md)}</pre></div>`;
        } else if (fmt === "json" && cache.json) {
          results.innerHTML = renderReport(cache.json, url || cache.url);
        }
      }

      // Switch tabs instantly from cache
      document.querySelectorAll('input[name="fmt"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          if (cache.json || cache.md) showActiveTab(cache.url);
        });
      });

      document.getElementById("repoUrl").addEventListener("keydown", (e) => {
        if (e.key === "Enter") analyze();
      });

      function shake(el) {
        el.style.animation = "none";
        el.style.borderColor = "rgba(248,81,73,0.6)";
        setTimeout(() => {
          el.style.borderColor = "";
        }, 1000);
      }

      function escHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function repoShortName(url) {
        try {
          const p = new URL(url).pathname.replace(/^\//, "").replace(/\/$/, "");
          return p;
        } catch {
          return url;
        }
      }

      function sectionIcon(emoji, bg) {
        return `<span class="icon" style="background:${bg}">${emoji}</span>`;
      }

      function renderReport(d, repoUrl) {
        let html = `<div class="results-header">
      <h2>Analysis Complete</h2>
      <span class="repo-pill">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ${escHtml(repoShortName(repoUrl))}
      </span>
    </div>`;

        // Overview
        if (d.overview) {
          html += `<div class="section">
        <div class="section-label">${sectionIcon("📋", "rgba(99,179,237,0.12)")} Overview</div>
        <p class="overview-text">${escHtml(d.overview)}</p>
      </div>`;
        }

        // Tech stack
        if (d.tech_stack?.length) {
          html += `<div class="section">
        <div class="section-label">${sectionIcon("⚡", "rgba(240,167,50,0.12)")} Tech Stack</div>
        <div class="tags">`;
          d.tech_stack.forEach((t) => {
            html += `<span class="tag">${escHtml(t)}</span>`;
          });
          html += `</div></div>`;
        }

        // Module map
        if (d.module_map?.length) {
          html += `<div class="section">
        <div class="section-label">${sectionIcon("🗂️", "rgba(188,140,255,0.12)")} Module Map</div>`;
          d.module_map.forEach((m) => {
            html += `<div class="module">
          <div class="module-name">${escHtml(m.name || "")}</div>
          <div class="module-purpose">${escHtml(m.purpose || "")}</div>`;
            if (m.key_files?.length) {
              html += `<div class="module-files">`;
              m.key_files.forEach((f) => {
                html += `<span class="file-chip">${escHtml(f)}</span>`;
              });
              html += `</div>`;
            }
            html += `</div>`;
          });
          html += `</div>`;
        }

        // Critical flows
        if (d.critical_flows?.length) {
          html += `<div class="section">
        <div class="section-label">${sectionIcon("🔄", "rgba(188,140,255,0.12)")} Critical Flows</div>`;
          d.critical_flows.forEach((f, i) => {
            if (i > 0) html += `<div class="flow-divider"></div>`;
            html += `<div class="flow">
          <div class="flow-name">${escHtml(f.name || "")}</div>
          <ol>`;
            (f.steps || []).forEach((s) => {
              html += `<li>${escHtml(s)}</li>`;
            });
            html += `</ol></div>`;
          });
          html += `</div>`;
        }

        // Onboarding path
        if (d.onboarding_path?.length) {
          html += `<div class="section">
        <div class="section-label">${sectionIcon("🚀", "rgba(86,211,100,0.12)")} Onboarding Path</div>
        <ul class="onboarding-list">`;
          d.onboarding_path.forEach((s) => {
            html += `<li>${escHtml(s)}</li>`;
          });
          html += `</ul></div>`;
        }

        // Improvements
        if (d.improvements?.length) {
          html += `<div class="section">
        <div class="section-label">${sectionIcon("💡", "rgba(240,167,50,0.12)")} Suggested Improvements</div>
        <ul class="improvement-list">`;
          d.improvements.forEach((s) => {
            html += `<li>${escHtml(s)}</li>`;
          });
          html += `</ul></div>`;
        }

        // Mermaid
        if (d.mermaid_diagram) {
          html += `<div class="section">
        <div class="section-label">${sectionIcon("🗺️", "rgba(99,179,237,0.12)")} Architecture Diagram</div>
        <pre class="mermaid-raw">${escHtml(d.mermaid_diagram)}</pre>
      </div>`;
        }

        return html;
      }
    </script>
  </body>
</html>
